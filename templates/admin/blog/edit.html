<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Blog Post | IYDP Admin</title>
    {% include 'admin/partials/head_assets.html' %}
    <style>
        .cke_chrome { border-radius: 1.5rem !important; border: 1.5px solid #e2e8f0 !important; overflow: hidden; }
    </style>
</head>
<body class="antialiased p-3 lg:p-6">

    <div class="flex flex-col lg:flex-row min-h-screen gap-6">
        
         {% include 'admin/partials/sidebar.html' %}
        <main class="flex-1 lg:pr-4">
            <header class="mb-10 px-4">
                <h2 class="display-font text-3xl lg:text-4xl font-black text-slate-900 uppercase">Edit Blog</h2>
                <p class="text-slate-500 font-bold mt-1 uppercase text-[10px] tracking-widest">Editing: {{ post.title }}</p>
            </header>

            <div class="rounded-panel p-8 lg:p-12 shadow-sm max-w-6xl">
                <form action="{{ url_for('edit_blog_post', id=post.id) }}" method="post" enctype="multipart/form-data" class="space-y-8">
                    
                    <div class="space-y-2">
                        <label for="title" class="text-[11px] font-black text-slate-400 uppercase tracking-widest ml-4">Blog Title *</label>
                        <input type="text" name="title" id="title" value="{{ post.title }}" required
                               class="input-field text-sm font-bold text-slate-700" placeholder="Enter post title">
                    </div>

                    <div class="space-y-2">
                        <label for="excerpt" class="text-[11px] font-black text-slate-400 uppercase tracking-widest ml-4">Short Excerpt (SEO)</label>
                        <textarea name="excerpt" id="excerpt" rows="2"
                                  class="input-field text-sm font-medium text-slate-700 leading-relaxed resize-none" 
                                  placeholder="Brief summary for search results...">{{ post.excerpt or '' }}</textarea>
                    </div>

                    <div class="space-y-2">
                        <label for="content" class="text-[11px] font-black text-slate-400 uppercase tracking-widest ml-4">Full Content *</label>
                        <textarea name="content" id="content" required>{{ post.content }}</textarea>
                    </div>

                    <div class="space-y-2">
                        <label for="image_url" class="text-[11px] font-black text-slate-400 uppercase tracking-widest ml-4">Featured Image URL</label>
                        <div class="flex flex-col md:flex-row gap-4">
                            <input type="url" name="image_url" id="image_url" value="{{ post.image_url or '' }}"
                                   class="input-field text-sm font-bold text-slate-700 flex-1" placeholder="https://example.com/image.jpg">
                            {% if post.image_url %}
                            <div class="w-20 h-20 rounded-2xl overflow-hidden border-4 border-slate-50 shadow-sm shrink-0">
                                <img src="{{ post.image_url }}" alt="Current" class="w-full h-full object-cover">
                            </div>
                            {% endif %}
                        </div>
                    </div>

                    <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-6 p-6 rounded-[2rem] bg-slate-50 border border-slate-100">
                        <div class="flex items-center gap-4">
                            <div class="relative inline-block w-12 h-6">
                                <input type="checkbox" name="is_published" id="is_published" 
                                       class="opacity-0 w-0 h-0 peer" {{ 'checked' if post.is_published else '' }}>
                                <label for="is_published" 
                                       class="absolute top-0 left-0 right-0 bottom-0 bg-slate-300 rounded-full cursor-pointer transition-all duration-300 peer-checked:bg-[#7dba4e]
                                              before:absolute before:content-[''] before:h-4 before:w-4 before:left-1 before:bottom-1 before:bg-white before:rounded-full before:transition-all peer-checked:before:translate-x-6"></label>
                            </div>
                            <label for="is_published" class="text-sm font-black text-slate-700 cursor-pointer uppercase tracking-tight">Publish Live</label>
                        </div>
                        
                        <div class="flex flex-col text-right">
                            <span class="text-[9px] font-black text-slate-400 uppercase tracking-widest">Post Statistics</span>
                            <div class="flex gap-4 mt-1">
                                <div class="text-[10px] font-bold text-slate-500"><i class="far fa-eye mr-1"></i> {{ post.view_count }} Views</div>
                                <div class="text-[10px] font-bold text-slate-500"><i class="far fa-calendar-alt mr-1"></i> {{ post.created_at|az_time('%d.%m.%Y') }}</div>
                            </div>
                        </div>
                    </div>

                    <div class="flex flex-col sm:flex-row justify-end gap-4 pt-6 border-t border-slate-50">
                        <a href="{{ url_for('list_blog_posts') }}" class="btn-cancel px-10 py-4 text-[10px]">
                            Discard Changes
                        </a>
                        <button type="submit" class="btn-save px-12 py-4 text-[10px] shadow-lg shadow-[#6f3d90]/20">
                            Update Blog Post
                        </button>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <script src="https://cdn.ckeditor.com/4.16.2/standard/ckeditor.js"></script>
    <script>
        CKEDITOR.replace('content', {
            language: 'az',
            height: 400,
            uiColor: '#ffffff',
            // Custom toolbar to match the clean UI
            toolbar: [
                { name: 'basicstyles', items: ['Bold', 'Italic', 'Underline', 'Strike', '-', 'RemoveFormat'] },
                { name: 'paragraph', items: ['NumberedList', 'BulletedList', '-', 'Blockquote', 'JustifyLeft', 'JustifyCenter', 'JustifyRight'] },
                { name: 'links', items: ['Link', 'Unlink'] },
                { name: 'insert', items: ['Image', 'Table', 'HorizontalRule', 'SpecialChar'] },
                { name: 'styles', items: ['Format', 'FontSize'] },
                { name: 'colors', items: ['TextColor', 'BGColor'] },
                { name: 'tools', items: ['Maximize'] }
            ]
        });
    </script>
</body>
</html>
