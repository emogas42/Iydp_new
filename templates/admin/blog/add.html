<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Blog Post | IYDP Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        html { font-size: 125%; }
        @font-face { font-family: 'Asterone'; src: local('Asterone'); }
        body { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; background-color: #f1f5f9; color: #0f172a; }
        .display-font { font-family: 'Asterone', sans-serif; letter-spacing: 0.05em; }
        
        :root {
            --iydp-blue: #00aef6; --iydp-red: #f06e60;
            --iydp-green: #7dba4e; --iydp-purple: #6f3d90;
        }

        .rounded-panel { background: #ffffff; border-radius: 2.5rem; border: 1px solid #e2e8f0; }
        
        .nav-pill {
            border-radius: 9999px; font-weight: 700; transition: all 0.3s ease; color: #64748b;
        }
        .nav-pill:hover { background: #f8fafc; color: #0f172a; }
        .nav-pill.active {
            background: var(--iydp-purple); color: #fff !important;
            box-shadow: 0 10px 20px -5px rgba(111, 61, 144, 0.3);
        }

        .input-field {
            border-radius: 1.25rem; border: 1.5px solid #e2e8f0; padding: 0.85rem 1.25rem;
            transition: all 0.3s ease; width: 100%; outline: none; background: #fff;
        }
        .input-field:focus { border-color: var(--iydp-purple); ring: 4px rgba(111, 61, 144, 0.1); }

        .btn-save {
            border-radius: 9999px; background: #0f172a; color: #fff;
            font-weight: 800; text-transform: uppercase; transition: all 0.3s ease;
            cursor: pointer; border: none;
        }
        .btn-save:hover { background: var(--iydp-purple); transform: translateY(-2px); box-shadow: 0 10px 15px rgba(111, 61, 144, 0.2); }
        
        .btn-cancel {
            border-radius: 9999px; background: #f1f5f9; color: #64748b;
            font-weight: 800; text-transform: uppercase; transition: all 0.3s ease;
            text-align: center;
        }
        .btn-cancel:hover { background: #e2e8f0; color: #0f172a; }

        /* CKEditor UI Fixes */
        .cke_chrome { border-radius: 1.5rem !important; border: 1.5px solid #e2e8f0 !important; overflow: hidden; }
    </style>
</head>
<body class="antialiased p-3 lg:p-6">

    <div class="flex flex-col lg:flex-row min-h-screen gap-6">
        
         {% include 'admin/partials/sidebar.html' %}

        <main class="flex-1 lg:pr-4">
            <header class="mb-10 px-4">
                <h2 class="display-font text-3xl lg:text-4xl font-black text-slate-900 uppercase">New Blog Post</h2>
                <p class="text-slate-500 font-bold mt-1 uppercase text-[10px] tracking-widest">Write and publish a new blog</p>
            </header>

            <div class="rounded-panel p-8 lg:p-12 shadow-sm max-w-6xl">
                <form method="POST" action="{{ url_for('add_blog_post') }}" enctype="multipart/form-data" class="space-y-8">
                    
                    <div class="space-y-2">
                        <label for="title" class="text-[11px] font-black text-slate-400 uppercase tracking-widest ml-4">Blog Title *</label>
                        <input type="text" name="title" id="title" required placeholder="Ex: Impact of Youth in Global Development"
                               class="input-field text-sm font-bold text-slate-700">
                    </div>

                    <div class="space-y-2">
                        <label for="excerpt" class="text-[11px] font-black text-slate-400 uppercase tracking-widest ml-4">Excerpt (Summary)</label>
                        <textarea name="excerpt" id="excerpt" rows="3" placeholder="A short summary of your blog post..."
                                 class="input-field text-sm font-medium text-slate-700 leading-relaxed resize-none"></textarea>
                    </div>

                    <div class="space-y-2">
                        <label for="content" class="text-[11px] font-black text-slate-400 uppercase tracking-widest ml-4">Blog Content *</label>
                        <textarea name="content" id="content" required></textarea>
                    </div>

                    <div class="space-y-2">
                        <label for="image_url" class="text-[11px] font-black text-slate-400 uppercase tracking-widest ml-4">Featured Image URL</label>
                        <div class="relative">
                            <i class="fas fa-image absolute left-5 top-1/2 -translate-y-1/2 text-slate-300"></i>
                            <input type="url" name="image_url" id="image_url" placeholder="https://example.com/cover-image.jpg"
                                   class="input-field pl-12 text-sm font-bold text-slate-700">
                        </div>
                    </div>

                    <div class="flex items-center justify-between p-6 rounded-[2rem] bg-slate-50 border border-slate-100">
                        <div class="flex items-center gap-4">
                            <div class="relative inline-block w-12 h-6">
                                <input type="checkbox" name="is_published" id="is_published" checked
                                       class="opacity-0 w-0 h-0 peer">
                                <label for="is_published" 
                                       class="absolute top-0 left-0 right-0 bottom-0 bg-slate-300 rounded-full cursor-pointer transition-all duration-300 peer-checked:bg-[#7dba4e]
                                              before:absolute before:content-[''] before:h-4 before:w-4 before:left-1 before:bottom-1 before:bg-white before:rounded-full before:transition-all peer-checked:before:translate-x-6"></label>
                            </div>
                            <div>
                                <label for="is_published" class="text-sm font-black text-slate-700 cursor-pointer uppercase tracking-tight">Publish Live</label>
                                <p class="text-[10px] font-bold text-slate-400">If checked, it will be visible to users immediately.</p>
                            </div>
                        </div>
                    </div>

                    <div class="flex flex-col sm:flex-row justify-end gap-4 pt-6">
                        <a href="{{ url_for('list_blog_posts') }}" class="btn-cancel px-10 py-4 text-[10px]">
                            Discard Draft
                        </a>
                        <button type="submit" class="btn-save px-12 py-4 text-[10px] shadow-lg">
                            <i class="fas fa-cloud-upload-alt mr-2"></i> Save Blog Post
                        </button>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <script src="https://cdn.ckeditor.com/4.16.2/standard/ckeditor.js"></script>
    <script>
        CKEDITOR.replace('content', {
            language: 'az',
            height: 400,
            uiColor: '#ffffff',
            toolbar: [
                { name: 'basicstyles', items: ['Bold', 'Italic', 'Underline', 'Strike', '-', 'RemoveFormat'] },
                { name: 'paragraph', items: ['NumberedList', 'BulletedList', '-', 'Blockquote', 'JustifyLeft', 'JustifyCenter', 'JustifyRight'] },
                { name: 'links', items: ['Link', 'Unlink'] },
                { name: 'insert', items: ['Image', 'Table', 'HorizontalRule', 'SpecialChar'] },
                { name: 'styles', items: ['Format', 'FontSize'] },
                { name: 'colors', items: ['TextColor', 'BGColor'] },
                { name: 'tools', items: ['Maximize'] }
            ]
        });
    </script>
</body>
</html>
