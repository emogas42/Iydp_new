<link rel="icon" href="{{ url_for('static', filename='logo.png') }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
    // The four colours of the IYDP logo, plus a dark ink for text.
    tailwind.config = {
        theme: {
            extend: {
                colors: {
                    ink: '#0f172a',
                    iblue: { DEFAULT: '#00aef6', 600: '#008cc5', dark: '#006994', soft: '#e6f7fe' },
                    ipurple: { DEFAULT: '#6f3d90', dark: '#593173', soft: '#f3eef7' },
                    igreen: { DEFAULT: '#7dba4e', dark: '#4f7f2b', soft: '#f0f7ea' },
                    ired: { DEFAULT: '#f06e60', dark: '#c7463a', soft: '#fdeeec' },
                },
                fontFamily: {
                    sans: ['Plus Jakarta Sans', 'ui-sans-serif', 'system-ui', '-apple-system', 'Segoe UI', 'sans-serif'],
                },
            },
        },
    }
</script>
<style type="text/tailwindcss">
    @layer components {
        .card { @apply rounded-lg border border-slate-200 bg-white; }
        .card-header { @apply flex items-center justify-between gap-3 border-b border-slate-200 px-4 py-3 sm:px-5; }
        .card-title { @apply text-[15px] font-semibold text-ink; }

        .btn { @apply inline-flex h-11 items-center justify-center gap-2 whitespace-nowrap rounded-md px-4 text-sm font-semibold transition-colors focus:outline-none focus-visible:ring-2 focus-visible:ring-iblue focus-visible:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-60; }

        .btn-secondary { @apply border border-slate-300 bg-white text-slate-700 hover:bg-slate-50; }
        .btn-success { @apply bg-igreen-dark text-white hover:bg-[#3f6622]; }
        .btn-danger { @apply border border-slate-300 bg-white text-ired-dark hover:border-ired hover:bg-ired-soft; }
        .btn-ghost { @apply text-slate-600 hover:bg-slate-100 hover:text-ink; }
        .btn-lg { @apply h-12 px-5 text-[15px]; }

        .link { @apply font-semibold text-iblue-dark hover:text-ink; }

        .label { @apply mb-1.5 flex items-baseline gap-1 text-sm font-semibold text-slate-800; }
        .label .optional { @apply ml-auto text-xs font-normal text-slate-400; }
        .label .required { @apply text-ired-dark; }
        .hint { @apply mt-1.5 text-[13px] leading-snug text-slate-500; }
        .input { @apply block w-full rounded-md border border-slate-300 bg-white px-3.5 py-3 text-[15px] text-ink placeholder:text-slate-400 transition focus:border-iblue focus:outline-none focus:ring-2 focus:ring-iblue/25; }

        .input-icon > svg { @apply pointer-events-none absolute left-3.5 top-1/2 h-4 w-4 -translate-y-1/2 text-slate-400; }

        .badge::before { content: ''; @apply h-2 w-2 shrink-0 rounded-full bg-slate-300; }
        .badge-green::before { @apply bg-igreen; }
        .badge-amber::before { @apply bg-iblue; }
        .badge-blue::before { @apply bg-iblue; }
        .badge-red::before { @apply bg-ired; }
        .badge-purple::before { @apply bg-ipurple; }

        .list-row { @apply flex items-center gap-3 px-4 py-3.5 transition-colors hover:bg-slate-50 active:bg-slate-100 sm:px-5; }
    }
