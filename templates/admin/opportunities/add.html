<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Opportunity | IYDP Admin</title>
    {% include 'admin/partials/head_assets.html' %}
    <style>
        .input-field:focus { border-color: var(--iydp-red); }
        .btn-save:hover { background: var(--iydp-red); box-shadow: 0 10px 15px rgba(240, 110, 96, 0.2); }
    </style>
</head>
<body class="antialiased p-3 lg:p-6">

    <div class="flex flex-col lg:flex-row min-h-screen gap-6">
         {% include 'admin/partials/sidebar.html' %}

        <main class="flex-1 lg:pr-4">
            <header class="mb-10 px-4">
                <h2 class="display-font text-3xl lg:text-4xl font-black text-slate-900 uppercase">New Opportunity</h2>
                <p class="text-slate-500 font-bold mt-1 uppercase text-[10px] tracking-widest">Create a new program entry</p>
            </header>

            <div class="rounded-panel p-8 lg:p-12 shadow-sm max-w-6xl">
                <form method="POST" action="{{ url_for('add_opportunity') }}" class="space-y-8">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    
                    <div class="space-y-2">
                        <label for="title" class="text-[11px] font-black text-slate-400 uppercase tracking-widest ml-4">Program Title *</label>
                        <input type="text" name="title" id="title" required placeholder="Ex: Global Youth Leadership Summit 2026"
                               class="input-field text-sm font-bold text-slate-700">
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                        <div class="space-y-2">
                            <label for="description" class="text-[11px] font-black text-slate-400 uppercase tracking-widest ml-4">Description *</label>
                            <textarea id="description" name="description" rows="5" required
                                      class="input-field text-sm font-medium text-slate-700 leading-relaxed resize-none" placeholder="Explain the opportunity..."></textarea>
                        </div>
                        <div class="space-y-2">
                            <label for="requirements" class="text-[11px] font-black text-slate-400 uppercase tracking-widest ml-4">Requirements</label>
                            <textarea id="requirements" name="requirements" rows="5"
                                      class="input-field text-sm font-medium text-slate-700 leading-relaxed resize-none" placeholder="Enter requirements (one per line)..."></textarea>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                        <div class="space-y-2">
                            <label for="location" class="text-[11px] font-black text-slate-400 uppercase tracking-widest ml-4">Location</label>
                            <div class="relative">
                                <i class="fas fa-map-marker-alt absolute left-5 top-1/2 -translate-y-1/2 text-slate-300"></i>
                                <input type="text" name="location" id="location"
                                       class="input-field pl-12 text-sm font-bold text-slate-700" placeholder="Remote, Baku, or Global">
                            </div>
                        </div>
                        <div class="space-y-2">
                            <label for="deadline" class="text-[11px] font-black text-slate-400 uppercase tracking-widest ml-4">Deadline</label>
                            <div class="relative">
                                <i class="fas fa-calendar-plus absolute left-5 top-1/2 -translate-y-1/2 text-slate-300"></i>
                                <input type="date" name="deadline" id="deadline"
                                       class="input-field pl-12 text-sm font-bold text-slate-700">
                            </div>
                        </div>
                    </div>

                    <div class="space-y-2">
                        <label for="tags" class="text-[11px] font-black text-slate-400 uppercase tracking-widest ml-4">Categorization Tags</label>
                        <div class="relative">
                            <i class="fas fa-tags absolute left-5 top-1/2 -translate-y-1/2 text-slate-300"></i>
                            <input type="text" name="tags" id="tags"
                                   class="input-field pl-12 text-sm font-bold text-slate-700" 
                                   placeholder="Leadership, Volunteer, Internship (Separate by commas)">
                        </div>
                    </div>

                    <div class="flex items-center justify-between p-6 rounded-[2rem] bg-slate-50 border border-slate-100">
                        <div class="flex items-center gap-4">
                            <div class="relative inline-block w-12 h-6">
                                <input type="checkbox" name="is_active" id="is_active" checked
                                       class="opacity-0 w-0 h-0 peer">
                                <label for="is_active" 
                                       class="absolute top-0 left-0 right-0 bottom-0 bg-slate-300 rounded-full cursor-pointer transition-all duration-300 peer-checked:bg-[#7dba4e]
                                              before:absolute before:content-[''] before:h-4 before:w-4 before:left-1 before:bottom-1 before:bg-white before:rounded-full before:transition-all peer-checked:before:translate-x-6"></label>
                            </div>
                            <div>
                                <label for="is_active" class="text-sm font-black text-slate-700 cursor-pointer uppercase tracking-tight">Active on Website</label>
                                <p class="text-[10px] font-bold text-slate-400">If checked, it will be visible to users immediately.</p>
                            </div>
                        </div>
                    </div>

                    <div class="flex flex-col sm:flex-row justify-end gap-4 pt-6">
                        <a href="{{ url_for('list_opportunities') }}" class="btn-cancel px-10 py-4 text-[10px]">
                            Discard Entry
                        </a>
                        <button type="submit" class="btn-save px-12 py-4 text-[10px] shadow-lg shadow-red-100">
                            <i class="fas fa-cloud-upload-alt mr-2"></i> Save Opportunity
                        </button>
                    </div>
                </form>
            </div>
        </main>
    </div>

</body>
</html>
