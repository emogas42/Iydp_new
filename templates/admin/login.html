<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - IYDP Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        html { font-size: 125%; }
        body { 
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; 
            background-color: #f1f5f9;
        }

        .bg-iydp-purple { background-color: #6f3d90; }
        .text-iydp-purple { color: #6f3d90; }
        
        .input-focus:focus { 
            border-color: #6f3d90; 
            box-shadow: 0 0 0 4px rgba(111, 61, 144, 0.1); 
        }
        
        .btn-hover { transition: all 0.2s ease-in-out; }
        .btn-hover:hover {
            background-color: #5a3176 !important;
            transform: translateY(-1px);
            box-shadow: 0 10px 20px -5px rgba(111, 61, 144, 0.4);
        }
    </style>
</head>
<body class="antialiased min-h-screen flex items-center justify-center p-6">

    <div class="max-w-md w-full">
        <div class="flex justify-center mb-10">
<img src="{{ url_for('static', filename='logo.png') }}" alt="Logo">
        </div>

        <div class="bg-white rounded-[2.5rem] border border-slate-200 shadow-2xl p-8 md:p-12">
            <div class="text-center mb-8">
                <h2 class="text-3xl font-black text-slate-900 tracking-tight">Admin Portal</h2>
                <p class="text-slate-500 font-bold text-sm mt-2 uppercase tracking-widest">Sign in to continue</p>
            </div>
            
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="mb-6 rounded-2xl p-4 flex items-center gap-3 text-sm font-bold shadow-sm {% if category == 'success' %}bg-green-50 text-green-700 border border-green-200{% else %}bg-red-50 text-red-700 border border-red-200{% endif %}">
                            <i class="fas {% if category == 'success' %}fa-check-circle{% else %}fa-exclamation-triangle{% endif %}"></i>
                            {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form action="{{ url_for('login') }}" method="POST" class="space-y-6">
                <input type="hidden" name="next" value="{{ request.args.get('next', '') }}">
                
                <div>
                    <label for="username" class="block text-xs font-black text-slate-400 uppercase tracking-[0.1em] mb-2 ml-1">Username</label>
                    <div class="relative group">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-slate-400 group-focus-within:text-iydp-purple">
                            <i class="fas fa-user-shield"></i>
                        </span>
                        <input id="username" name="username" type="text" required 
                               class="input-focus block w-full pl-12 pr-4 py-4 bg-slate-50 border border-slate-200 rounded-2xl text-slate-900 font-bold placeholder-slate-400 outline-none transition-all"
                               placeholder="Enter your username">
                    </div>
                </div>

                <div>
                    <label for="password" class="block text-xs font-black text-slate-400 uppercase tracking-[0.1em] mb-2 ml-1">Password</label>
                    <div class="relative group">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-slate-400 group-focus-within:text-iydp-purple">
                            <i class="fas fa-key"></i>
                        </span>
                        <input id="password" name="password" type="password" required 
                               class="input-focus block w-full pl-12 pr-4 py-4 bg-slate-50 border border-slate-200 rounded-2xl text-slate-900 font-bold placeholder-slate-400 outline-none transition-all"
                               placeholder="••••••••">
                    </div>
                </div>

                <button type="submit" 
                        class="w-full py-4 px-6 bg-iydp-purple text-white text-sm font-black rounded-2xl btn-hover uppercase tracking-widest flex justify-center items-center">
                    <i class="fas fa-sign-in-alt mr-3"></i>
                    Sign In
                </button>
            </form>
        </div>
        
        <div class="text-center mt-12">
            <p class="text-[10px] font-black text-slate-400 uppercase tracking-[0.2em]">
                International Youth Dialogue Platform
            </p>
            <div class="flex justify-center gap-3 mt-4 opacity-50">
                <div class="w-1.5 h-1.5 rounded-full bg-[#00aef6]"></div>
                <div class="w-1.5 h-1.5 rounded-full bg-[#f06e60]"></div>
                <div class="w-1.5 h-1.5 rounded-full bg-[#7dba4e]"></div>
                <div class="w-1.5 h-1.5 rounded-full bg-[#6f3d90]"></div>
            </div>
            <p class="text-[9px] text-slate-400 font-bold mt-4">© 2026 IYDP. All rights reserved.</p>
        </div>
    </div>

</body>
</html>
