<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create News | IYDP Admin</title>
    {% include 'admin/partials/head_assets.html' %}
    <style>
        .input-field:focus { border-color: var(--iydp-green); }
        .btn-save:hover { background: var(--iydp-green); box-shadow: 0 10px 15px rgba(125, 186, 78, 0.2); }
    </style>
</head>
<body class="antialiased p-3 lg:p-6">

    <div class="flex flex-col lg:flex-row min-h-screen gap-6">
        
         {% include 'admin/partials/sidebar.html' %}
        <main class="flex-1 lg:pr-4">
            <header class="mb-10 px-4">
                <h2 class="display-font text-3xl lg:text-4xl font-black text-slate-900 uppercase">Add News</h2>
                <p class="text-slate-500 font-bold mt-1 uppercase text-[10px] tracking-widest">Create news </p>
            </header>

            <div class="rounded-panel p-8 lg:p-12 shadow-sm max-w-6xl">
                <form method="POST" action="{{ url_for('add_news') }}" class="space-y-8">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                        <div class="space-y-2">
                            <label for="title" class="text-[11px] font-black text-slate-400 uppercase tracking-widest ml-4">news Title *</label>
                            <input type="text" name="title" id="title" required placeholder="Enter a catchy title..."
                                   class="input-field text-sm font-bold text-slate-700">
                        </div>

                        <div class="space-y-2">
                            <label for="image_url" class="text-[11px] font-black text-slate-400 uppercase tracking-widest ml-4">Cover Image URL</label>
                            <div class="relative">
                                <i class="fas fa-image absolute left-5 top-1/2 -translate-y-1/2 text-slate-300"></i>
                                <input type="url" name="image_url" id="image_url" placeholder="https://example.com/image.jpg"
                                       class="input-field pl-12 text-sm font-bold text-slate-700">
                            </div>
                        </div>
                    </div>

                    <div class="space-y-2">
                        <label for="content" class="text-[11px] font-black text-slate-400 uppercase tracking-widest ml-4">Full Content Body *</label>
                        <textarea name="content" id="content" rows="12" required 
                                  placeholder="Write your news content here (HTML supported)..."
                                  class="input-field text-sm font-medium text-slate-700 leading-relaxed resize-none"></textarea>
                    </div>

                    <div class="flex items-center justify-between p-6 rounded-[2rem] bg-slate-50 border border-slate-100">
                        <div class="flex items-center gap-4">
                            <div class="relative inline-block w-12 h-6">
                                <input type="checkbox" name="is_published" id="is_published" checked
                                       class="opacity-0 w-0 h-0 peer">
                                <label for="is_published" 
                                       class="absolute top-0 left-0 right-0 bottom-0 bg-slate-300 rounded-full cursor-pointer transition-all duration-300 peer-checked:bg-[#7dba4e]
                                              before:absolute before:content-[''] before:h-4 before:w-4 before:left-1 before:bottom-1 before:bg-white before:rounded-full before:transition-all peer-checked:before:translate-x-6"></label>
                            </div>
                            <div>
                                <label for="is_published" class="text-sm font-black text-slate-700 cursor-pointer uppercase tracking-tight">Active on Website</label>
                                <p class="text-[10px] font-bold text-slate-400">Visible to users as soon as you save.</p>
                            </div>
                        </div>
                    </div>

                    <div class="flex flex-col sm:flex-row justify-end gap-4 pt-6">
                        <a href="{{ url_for('list_news') }}" class="btn-cancel px-10 py-4 text-[10px]">
                            Discard Draft
                        </a>
                        <button type="submit" class="btn-save px-12 py-4 text-[10px] shadow-lg shadow-green-100">
                            <i class="fas fa-cloud-upload-alt mr-2"></i> Save news
                        </button>
                    </div>
                </form>
            </div>
        </main>
    </div>

</body>
</html>
